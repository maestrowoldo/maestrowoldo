<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Core toolkit workflow</title>
  <desc id="description">Animated engineering workflow connecting interfaces, APIs and data, quality and delivery, and automation and insights.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop class="bg-start"/>
      <stop offset=".5" class="bg-middle"/>
      <stop offset="1" class="bg-end"/>
    </linearGradient>
    <linearGradient id="flow" x1="98" y1="150" x2="1102" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".35" stop-color="#3B82F6"/>
      <stop offset=".7" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#3B82F6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path class="grid-line" d="M28 0H0V28"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="280" rx="28"/></clipPath>
  </defs>
  <style>
    :root {
      --card: #0B1728; --heading: #F8FAFC; --muted: #64748B;
      --line: #334155; --grid: #CBD5E1; --label: #94A3B8;
      --bg-start: #050B14; --bg-middle: #081625; --bg-end: #090D19;
    }
    .bg-start { stop-color: var(--bg-start); }
    .bg-middle { stop-color: var(--bg-middle); }
    .bg-end { stop-color: var(--bg-end); }
    .grid-line { stroke: var(--grid); stroke-opacity: .045; }
    .card { fill: var(--card); }
    .heading { fill: var(--heading); }
    .muted { fill: var(--muted); }
    .eyebrow { fill: var(--label); }
    .base-line { stroke: var(--line); }
    .flow { stroke-dasharray: 8 12; animation: move 10s linear infinite; }
    .card-one { animation: float 5.5s ease-in-out infinite; }
    .card-two { animation: float 5.5s .5s ease-in-out infinite; }
    .card-three { animation: float 5.5s 1s ease-in-out infinite; }
    .card-four { animation: float 5.5s 1.5s ease-in-out infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.8s ease-in-out infinite; }
    .scan { animation: scan 8s ease-in-out infinite; }
    @keyframes move { to { stroke-dashoffset: -160; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pulse { 0%, 100% { transform: scale(.85); opacity: .5; } 50% { transform: scale(1.15); opacity: 1; } }
    @keyframes scan { 0%, 18% { transform: translateX(-360px); opacity: 0; } 42%, 58% { opacity: .65; } 82%, 100% { transform: translateX(1320px); opacity: 0; } }
    @media (prefers-color-scheme: light) {
      :root {
        --card: #FFFFFF; --heading: #0F172A; --muted: #64748B;
        --line: #CBD5E1; --grid: #0F172A; --label: #64748B;
        --bg-start: #F8FAFC; --bg-middle: #EFF6FF; --bg-end: #FAF5FF;
      }
      .scan { opacity: .55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow, .card-one, .card-two, .card-three, .card-four, .pulse, .scan { animation: none !important; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="280" rx="28" fill="url(#background)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <circle cx="600" cy="150" r="390" fill="url(#glow)"/>
    <path class="scan" d="M-320 0H-80L150 280H-90L-320 0Z" fill="#67E8F9" fill-opacity=".035"/>

    <text class="eyebrow" x="600" y="42" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.8">FROM IDEA TO RELIABLE DELIVERY</text>
    <path class="base-line" d="M132 145H1068" stroke-width="2"/>
    <path class="flow" d="M132 145H1068" stroke="url(#flow)" stroke-width="2.5" stroke-linecap="round"/>

    <g class="card-one" filter="url(#shadow)">
      <rect class="card" x="48" y="82" width="252" height="142" rx="22" stroke="#22D3EE" stroke-opacity=".42"/>
      <circle class="pulse" cx="84" cy="116" r="9" fill="#22D3EE" fill-opacity=".2"/>
      <circle cx="84" cy="116" r="4" fill="#22D3EE"/>
      <text x="108" y="121" fill="#22D3EE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="750" letter-spacing="1.1">INTERFACES</text>
      <text class="heading" x="72" y="166" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700">Product experience</text>
      <text class="muted" x="72" y="194" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">React · Next.js · Tailwind</text>
    </g>

    <g class="card-two" filter="url(#shadow)">
      <rect class="card" x="332" y="82" width="252" height="142" rx="22" stroke="#3B82F6" stroke-opacity=".46"/>
      <circle class="pulse" cx="368" cy="116" r="9" fill="#60A5FA" fill-opacity=".2"/>
      <circle cx="368" cy="116" r="4" fill="#60A5FA"/>
      <text x="392" y="121" fill="#60A5FA" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="750" letter-spacing="1.1">APIs &amp; DATA</text>
      <text class="heading" x="356" y="166" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700">Business logic</text>
      <text class="muted" x="356" y="194" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Node.js · PostgreSQL · Prisma</text>
    </g>

    <g class="card-three" filter="url(#shadow)">
      <rect class="card" x="616" y="82" width="252" height="142" rx="22" stroke="#A855F7" stroke-opacity=".44"/>
      <circle class="pulse" cx="652" cy="116" r="9" fill="#C084FC" fill-opacity=".2"/>
      <circle cx="652" cy="116" r="4" fill="#C084FC"/>
      <text x="676" y="121" fill="#C084FC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="750" letter-spacing="1.1">QUALITY &amp; DELIVERY</text>
      <text class="heading" x="640" y="166" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700">Reliable shipping</text>
      <text class="muted" x="640" y="194" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Testing · Docker · Cloud</text>
    </g>

    <g class="card-four" filter="url(#shadow)">
      <rect class="card" x="900" y="82" width="252" height="142" rx="22" stroke="#F472B6" stroke-opacity=".4"/>
      <circle class="pulse" cx="936" cy="116" r="9" fill="#F472B6" fill-opacity=".2"/>
      <circle cx="936" cy="116" r="4" fill="#F472B6"/>
      <text x="960" y="121" fill="#F472B6" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="750" letter-spacing="1.1">AUTOMATION</text>
      <text class="heading" x="924" y="166" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700">Operational insight</text>
      <text class="muted" x="924" y="194" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Power Platform · BI</text>
    </g>
  </g>
</svg>