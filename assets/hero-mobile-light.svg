<svg width="760" height="420" viewBox="0 0 760 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mobile-light-title mobile-light-description">
  <title id="mobile-light-title">Wolkendo Arias — Full-Stack Developer</title>
  <desc id="mobile-light-description">Light mobile banner presenting Wolkendo Arias as a full-stack developer who builds production-ready products across interfaces, APIs, data, and delivery.</desc>
  <defs>
    <linearGradient id="mobile-light-background" x1="20" y1="12" x2="740" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset=".52" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#FAF5FF"/>
    </linearGradient>
    <linearGradient id="mobile-light-name" x1="300" y1="88" x2="652" y2="143" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2"/>
      <stop offset=".5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="mobile-light-route" x1="86" y1="0" x2="674" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2"/>
      <stop offset=".52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <radialGradient id="mobile-light-cyan-glow">
      <stop stop-color="#22D3EE" stop-opacity=".14"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mobile-light-violet-glow">
      <stop stop-color="#A855F7" stop-opacity=".11"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mobile-light-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#0F172A" stroke-opacity=".045"/>
    </pattern>
    <filter id="mobile-light-shadow" x="-20%" y="-35%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#64748B" flood-opacity=".2"/>
    </filter>
    <clipPath id="mobile-light-frame">
      <rect width="760" height="420" rx="26"/>
    </clipPath>
  </defs>
  <style>
    .mobile-light-route {
      stroke-dasharray: 12 14;
      animation: mobile-light-flow 15s linear infinite;
    }
    .mobile-light-status {
      transform-box: fill-box;
      transform-origin: center;
      animation: mobile-light-pulse 3.8s ease-in-out infinite;
    }
    .mobile-light-accent {
      animation: mobile-light-drift 11s ease-in-out infinite alternate;
    }
    @keyframes mobile-light-flow {
      to { stroke-dashoffset: -208; }
    }
    @keyframes mobile-light-pulse {
      0%, 100% { transform: scale(.9); opacity: .58; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes mobile-light-drift {
      to { transform: translate(18px, 8px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mobile-light-route,
      .mobile-light-status,
      .mobile-light-accent {
        animation: none !important;
      }
    }
  </style>

  <g clip-path="url(#mobile-light-frame)">
    <rect width="760" height="420" rx="26" fill="url(#mobile-light-background)"/>
    <rect width="760" height="420" fill="url(#mobile-light-grid)"/>
    <circle class="mobile-light-accent" cx="55" cy="30" r="210" fill="url(#mobile-light-cyan-glow)"/>
    <circle cx="724" cy="398" r="230" fill="url(#mobile-light-violet-glow)"/>

    <g transform="translate(36 30)">
      <rect width="355" height="38" rx="19" fill="#0891B2" fill-opacity=".065" stroke="#0891B2" stroke-opacity=".27"/>
      <circle cx="23" cy="19" r="6" fill="#059669"/>
      <text x="43" y="25" fill="#0E7490" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.35">PRODUCT · ENGINEERING · DELIVERY</text>
    </g>

    <text x="36" y="137" fill="#0F172A" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="58" font-weight="760" letter-spacing="-1.7">
      <tspan>WOLKENDO </tspan>
      <tspan fill="url(#mobile-light-name)">ARIAS</tspan>
    </text>
    <text x="38" y="177" fill="#1E293B" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2.5">FULL-STACK DEVELOPER</text>
    <text x="38" y="213" fill="#475569" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="500">Building production-ready products, end to end.</text>

    <g transform="translate(32 246)" filter="url(#mobile-light-shadow)">
      <rect width="696" height="138" rx="24" fill="#FFFFFF" fill-opacity=".9" stroke="#CBD5E1"/>
      <rect x=".75" y=".75" width="694.5" height="136.5" rx="23.25" stroke="#0891B2" stroke-opacity=".08" stroke-width="1.5"/>

      <g transform="translate(24 19)">
        <g class="mobile-light-status">
          <circle cx="6" cy="6" r="6" fill="#059669" fill-opacity=".18"/>
          <circle cx="6" cy="6" r="3.5" fill="#059669"/>
        </g>
        <text x="24" y="12" fill="#475569" font-family="Consolas, SFMono-Regular, monospace" font-size="15" font-weight="600" letter-spacing="1.3">PRODUCT SYSTEM / ONLINE</text>
      </g>

      <path d="M90 89H606" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
      <path class="mobile-light-route" d="M90 89H606" stroke="url(#mobile-light-route)" stroke-width="3" stroke-linecap="round"/>

      <g transform="translate(20 58)">
        <rect width="148" height="58" rx="18" fill="#ECFEFF" stroke="#0891B2" stroke-opacity=".36"/>
        <circle cx="20" cy="29" r="6" fill="#0891B2"/>
        <text x="38" y="36" fill="#155E75" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing=".7">INTERFACES</text>
      </g>
      <g transform="translate(190 58)">
        <rect width="138" height="58" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-opacity=".36"/>
        <circle cx="22" cy="29" r="6" fill="#2563EB"/>
        <text x="42" y="36" fill="#1E40AF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">APIs</text>
      </g>
      <g transform="translate(350 58)">
        <rect width="138" height="58" rx="18" fill="#ECFDF5" stroke="#059669" stroke-opacity=".32"/>
        <circle cx="22" cy="29" r="6" fill="#059669"/>
        <text x="42" y="36" fill="#065F46" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">DATA</text>
      </g>
      <g transform="translate(510 58)">
        <rect width="166" height="58" rx="18" fill="#FAF5FF" stroke="#9333EA" stroke-opacity=".34"/>
        <circle cx="22" cy="29" r="6" fill="#9333EA"/>
        <text x="42" y="36" fill="#6B21A8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing=".8">DELIVERY</text>
      </g>
    </g>

    <rect x=".75" y=".75" width="758.5" height="418.5" rx="25.25" stroke="#0891B2" stroke-opacity=".15" stroke-width="1.5"/>
  </g>
</svg>
