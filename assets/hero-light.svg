<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Wolkendo Arias — Full-Stack Developer</title>
  <desc id="description">Animated technical banner representing interfaces, APIs, real-time systems, and reliable delivery.</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1160" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.5" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accent" x1="190" y1="100" x2="720" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2"/>
      <stop offset="0.48" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="route" x1="805" y1="108" x2="1092" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#9333EA" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop stop-color="#A855F7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#0F172A" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
  </defs>
  <style>
    .route { stroke-dasharray: 9 13; animation: route 14s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-in-out infinite; }
    .pulse-delay { animation-delay: -1.8s; }
    .float-a { animation: float-a 10s ease-in-out infinite alternate; }
    .float-b { animation: float-b 12s ease-in-out infinite alternate; }
    .scan { animation: scan 8s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(2, end) infinite; }
    @keyframes route { to { stroke-dashoffset: -176; } }
    @keyframes pulse { 0%, 100% { transform: scale(.82); opacity: .55; } 50% { transform: scale(1.18); opacity: 1; } }
    @keyframes float-a { to { transform: translate(28px, 14px); } }
    @keyframes float-b { to { transform: translate(-24px, -12px); } }
    @keyframes scan { 0%, 12% { transform: translateX(-310px); opacity: 0; } 32%, 58% { opacity: .54; } 78%, 100% { transform: translateX(1150px); opacity: 0; } }
    @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .route, .pulse, .float-a, .float-b, .scan, .cursor { animation: none !important; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" rx="28" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle class="float-a" cx="188" cy="50" r="245" fill="url(#glowCyan)"/>
    <circle class="float-b" cx="1090" cy="330" r="260" fill="url(#glowViolet)"/>
    <path class="scan" d="M-240 0L40 0L300 360H20L-240 0Z" fill="#0891B2" fill-opacity="0.03"/>

    <g transform="translate(72 56)">
      <rect width="196" height="30" rx="15" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-opacity="0.25"/>
      <circle cx="18" cy="15" r="4" fill="#0891B2"/>
      <text x="32" y="20" fill="#0E7490" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">FULL-STACK DEVELOPER</text>

      <text x="0" y="98" fill="#0F172A" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="54" font-weight="750" letter-spacing="-1.8">WOLKENDO ARIAS</text>
      <rect x="1" y="116" width="538" height="4" rx="2" fill="url(#accent)"/>
      <text x="0" y="158" fill="#475569" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="500">Interfaces · APIs · Realtime · Reliable delivery</text>

      <g transform="translate(0 196)">
        <rect width="552" height="56" rx="12" fill="#FFFFFF" fill-opacity="0.78" stroke="#CBD5E1"/>
        <circle cx="22" cy="18" r="4" fill="#E11D48"/>
        <circle cx="36" cy="18" r="4" fill="#D97706"/>
        <circle cx="50" cy="18" r="4" fill="#059669"/>
        <text x="22" y="40" fill="#94A3B8" font-family="Consolas, SFMono-Regular, monospace" font-size="12">$</text>
        <text x="38" y="40" fill="#334155" font-family="Consolas, SFMono-Regular, monospace" font-size="12">ship --from idea --to production</text>
        <rect class="cursor" x="286" y="30" width="7" height="13" rx="1" fill="#0891B2"/>
      </g>
    </g>

    <g transform="translate(770 62)">
      <rect width="356" height="240" rx="24" fill="#FFFFFF" fill-opacity="0.66" stroke="#CBD5E1"/>
      <path d="M54 128C96 44 175 48 202 112C229 176 283 176 312 92" stroke="#CBD5E1" stroke-width="1.5"/>
      <path class="route" d="M54 128C96 44 175 48 202 112C229 176 283 176 312 92" stroke="url(#route)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M74 190C119 142 164 154 194 192C223 229 274 214 296 172" stroke="#CBD5E1" stroke-width="1.5"/>
      <path class="route" d="M74 190C119 142 164 154 194 192C223 229 274 214 296 172" stroke="url(#route)" stroke-width="2.5" stroke-linecap="round" style="animation-direction:reverse"/>

      <g transform="translate(38 110)">
        <circle r="19" fill="#CFFAFE" stroke="#0891B2" stroke-opacity="0.72"/>
        <circle class="pulse" r="5" fill="#0891B2"/>
      </g>
      <g transform="translate(196 108)">
        <circle r="25" fill="#DBEAFE" stroke="#2563EB" stroke-opacity="0.7"/>
        <path d="M-8-6H8V6H-8V-6ZM-4-10V-6M4-10V-6M-4 6V10M4 6V10" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <g transform="translate(316 78)">
        <circle r="18" fill="#F3E8FF" stroke="#9333EA" stroke-opacity="0.7"/>
        <circle class="pulse pulse-delay" r="5" fill="#9333EA"/>
      </g>
      <g transform="translate(62 192)">
        <circle r="17" fill="#CFFAFE" stroke="#0891B2" stroke-opacity="0.6"/>
        <path d="M-6 1L-1 6L8-6" stroke="#0891B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(300 168)">
        <circle r="18" fill="#F3E8FF" stroke="#9333EA" stroke-opacity="0.62"/>
        <path d="M-7 4V-5H7V4M-4-5V-9H4V-5" stroke="#9333EA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g transform="translate(38 28)">
        <circle cx="4" cy="4" r="4" fill="#059669"/>
        <text x="16" y="9" fill="#64748B" font-family="Consolas, SFMono-Regular, monospace" font-size="11" letter-spacing="1.2">SYSTEMS ONLINE</text>
      </g>
    </g>
    <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="27.25" stroke="#0891B2" stroke-opacity="0.17" stroke-width="1.5"/>
  </g>
</svg>
