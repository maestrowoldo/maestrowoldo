<svg width="760" height="420" viewBox="0 0 760 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mobile-dark-title mobile-dark-description">
  <title id="mobile-dark-title">Wolkendo Arias — Full-Stack Developer</title>
  <desc id="mobile-dark-description">Dark mobile banner presenting Wolkendo Arias as a full-stack developer who builds production-ready products across interfaces, APIs, data, and delivery.</desc>
  <defs>
    <linearGradient id="mobile-dark-background" x1="20" y1="12" x2="740" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B14"/>
      <stop offset=".52" stop-color="#081625"/>
      <stop offset="1" stop-color="#100C1D"/>
    </linearGradient>
    <linearGradient id="mobile-dark-name" x1="300" y1="88" x2="652" y2="143" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset=".5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="mobile-dark-route" x1="86" y1="0" x2="674" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".52" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="mobile-dark-cyan-glow">
      <stop stop-color="#22D3EE" stop-opacity=".2"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mobile-dark-violet-glow">
      <stop stop-color="#A855F7" stop-opacity=".18"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mobile-dark-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#CBD5E1" stroke-opacity=".045"/>
    </pattern>
    <filter id="mobile-dark-shadow" x="-20%" y="-35%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <clipPath id="mobile-dark-frame">
      <rect width="760" height="420" rx="26"/>
    </clipPath>
  </defs>
  <style>
    .mobile-dark-route {
      stroke-dasharray: 12 14;
      animation: mobile-dark-flow 15s linear infinite;
    }
    .mobile-dark-status {
      transform-box: fill-box;
      transform-origin: center;
      animation: mobile-dark-pulse 3.8s ease-in-out infinite;
    }
    .mobile-dark-accent {
      animation: mobile-dark-drift 11s ease-in-out infinite alternate;
    }
    @keyframes mobile-dark-flow {
      to { stroke-dashoffset: -208; }
    }
    @keyframes mobile-dark-pulse {
      0%, 100% { transform: scale(.9); opacity: .58; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes mobile-dark-drift {
      to { transform: translate(18px, 8px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mobile-dark-route,
      .mobile-dark-status,
      .mobile-dark-accent {
        animation: none !important;
      }
    }
  </style>

  <g clip-path="url(#mobile-dark-frame)">
    <rect width="760" height="420" rx="26" fill="url(#mobile-dark-background)"/>
    <rect width="760" height="420" fill="url(#mobile-dark-grid)"/>
    <circle class="mobile-dark-accent" cx="55" cy="30" r="210" fill="url(#mobile-dark-cyan-glow)"/>
    <circle cx="724" cy="398" r="230" fill="url(#mobile-dark-violet-glow)"/>

    <g transform="translate(36 30)">
      <rect width="355" height="38" rx="19" fill="#67E8F9" fill-opacity=".075" stroke="#67E8F9" stroke-opacity=".26"/>
      <circle cx="23" cy="19" r="6" fill="#34D399"/>
      <text x="43" y="25" fill="#A5F3FC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.35">PRODUCT · ENGINEERING · DELIVERY</text>
    </g>

    <text x="36" y="137" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="58" font-weight="760" letter-spacing="-1.7">
      <tspan>WOLKENDO </tspan>
      <tspan fill="url(#mobile-dark-name)">ARIAS</tspan>
    </text>
    <text x="38" y="177" fill="#E2E8F0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2.5">FULL-STACK DEVELOPER</text>
    <text x="38" y="213" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="500">Building production-ready products, end to end.</text>

    <g transform="translate(32 246)" filter="url(#mobile-dark-shadow)">
      <rect width="696" height="138" rx="24" fill="#0B1728" fill-opacity=".88" stroke="#475569" stroke-opacity=".58"/>
      <rect x=".75" y=".75" width="694.5" height="136.5" rx="23.25" stroke="#67E8F9" stroke-opacity=".08" stroke-width="1.5"/>

      <g transform="translate(24 19)">
        <g class="mobile-dark-status">
          <circle cx="6" cy="6" r="6" fill="#34D399" fill-opacity=".24"/>
          <circle cx="6" cy="6" r="3.5" fill="#34D399"/>
        </g>
        <text x="24" y="12" fill="#94A3B8" font-family="Consolas, SFMono-Regular, monospace" font-size="15" font-weight="600" letter-spacing="1.3">PRODUCT SYSTEM / ONLINE</text>
      </g>

      <path d="M90 89H606" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <path class="mobile-dark-route" d="M90 89H606" stroke="url(#mobile-dark-route)" stroke-width="3" stroke-linecap="round"/>

      <g transform="translate(20 58)">
        <rect width="148" height="58" rx="18" fill="#0E2434" stroke="#22D3EE" stroke-opacity=".42"/>
        <circle cx="20" cy="29" r="6" fill="#22D3EE"/>
        <text x="38" y="36" fill="#CFFAFE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing=".7">INTERFACES</text>
      </g>
      <g transform="translate(190 58)">
        <rect width="138" height="58" rx="18" fill="#111C38" stroke="#60A5FA" stroke-opacity=".42"/>
        <circle cx="22" cy="29" r="6" fill="#60A5FA"/>
        <text x="42" y="36" fill="#DBEAFE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">APIs</text>
      </g>
      <g transform="translate(350 58)">
        <rect width="138" height="58" rx="18" fill="#10241F" stroke="#34D399" stroke-opacity=".38"/>
        <circle cx="22" cy="29" r="6" fill="#34D399"/>
        <text x="42" y="36" fill="#D1FAE5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">DATA</text>
      </g>
      <g transform="translate(510 58)">
        <rect width="166" height="58" rx="18" fill="#21132F" stroke="#C084FC" stroke-opacity=".42"/>
        <circle cx="22" cy="29" r="6" fill="#C084FC"/>
        <text x="42" y="36" fill="#F3E8FF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing=".8">DELIVERY</text>
      </g>
    </g>

    <rect x=".75" y=".75" width="758.5" height="418.5" rx="25.25" stroke="#67E8F9" stroke-opacity=".15" stroke-width="1.5"/>
  </g>
</svg>
