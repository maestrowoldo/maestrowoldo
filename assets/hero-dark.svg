<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Wolkendo Arias — Product-minded Full-Stack Developer</title>
  <desc id="description">Modern animated banner with floating labels for interfaces, APIs, realtime systems, and reliable delivery.</desc>
  <defs>
    <linearGradient id="background" x1="20" y1="12" x2="1180" y2="348" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B14"/>
      <stop offset=".46" stop-color="#081625"/>
      <stop offset="1" stop-color="#090D19"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="330" y1="80" x2="560" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset=".5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="coreGradient" x1="140" y1="80" x2="280" y2="215" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="routeGradient" x1="20" y1="42" x2="398" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop stop-color="#22D3EE" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop stop-color="#A855F7" stop-opacity=".2"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#CBD5E1" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#020617" flood-opacity=".5"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>
  <style>
    .route { stroke-dasharray: 8 12; animation: route 13s linear infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; }
    .core { transform-box: fill-box; transform-origin: center; animation: core 4s ease-in-out infinite; }
    .float-one { animation: float-one 7s ease-in-out infinite alternate; }
    .float-two { animation: float-two 8.5s ease-in-out infinite alternate; }
    .float-three { animation: float-three 9s ease-in-out infinite alternate; }
    .float-four { animation: float-four 7.8s ease-in-out infinite alternate; }
    .glow-one { animation: glow-one 12s ease-in-out infinite alternate; }
    .glow-two { animation: glow-two 14s ease-in-out infinite alternate; }
    .scan { animation: scan 9s ease-in-out infinite; }
    .type-cover { animation: type 7.5s steps(34, end) infinite; }
    .cursor { animation: blink 1.1s steps(2, end) infinite, type-cursor 7.5s steps(34, end) infinite; }
    @keyframes route { to { stroke-dashoffset: -160; } }
    @keyframes breathe { 0%, 100% { transform: scale(.92); opacity: .45; } 50% { transform: scale(1.08); opacity: .85; } }
    @keyframes core { 0%, 100% { transform: translateY(0) scale(.98); } 50% { transform: translateY(-4px) scale(1.03); } }
    @keyframes float-one { to { transform: translate(9px, -11px) rotate(.8deg); } }
    @keyframes float-two { to { transform: translate(-8px, 10px) rotate(-1deg); } }
    @keyframes float-three { to { transform: translate(11px, 8px) rotate(-.8deg); } }
    @keyframes float-four { to { transform: translate(-10px, -9px) rotate(1deg); } }
    @keyframes glow-one { to { transform: translate(35px, 18px); } }
    @keyframes glow-two { to { transform: translate(-30px, -16px); } }
    @keyframes scan { 0%, 16% { transform: translateX(-360px); opacity: 0; } 38%, 60% { opacity: .6; } 82%, 100% { transform: translateX(1260px); opacity: 0; } }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @keyframes type { 0%, 16% { transform: translateX(270px); } 17%, 27% { transform: translateX(0); } 72%, 100% { transform: translateX(270px); } }
    @keyframes type-cursor { 0%, 16% { transform: translateX(0); } 17%, 27% { transform: translateX(-265px); } 72%, 100% { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .route, .ring, .core, .float-one, .float-two, .float-three, .float-four, .glow-one, .glow-two, .scan, .type-cover, .cursor { animation: none !important; }
      .type-cover { transform: translateX(270px); }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" rx="28" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle class="glow-one" cx="120" cy="45" r="250" fill="url(#cyanGlow)"/>
    <circle class="glow-two" cx="1120" cy="340" r="280" fill="url(#violetGlow)"/>
    <path class="scan" d="M-300 0H-30L250 360H-20L-300 0Z" fill="#67E8F9" fill-opacity=".03"/>

    <g transform="translate(72 48)">
      <g>
        <rect width="272" height="30" rx="15" fill="#67E8F9" fill-opacity=".075" stroke="#67E8F9" stroke-opacity=".24"/>
        <circle cx="18" cy="15" r="4" fill="#34D399"/>
        <text x="32" y="20" fill="#A5F3FC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.45">PRODUCT · ENGINEERING · DELIVERY</text>
      </g>

      <text y="101" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="58" font-weight="760" letter-spacing="-2.2">
        <tspan x="0">WOLKENDO</tspan>
        <tspan x="326" fill="url(#titleGradient)">ARIAS</tspan>
      </text>
      <text x="1" y="140" fill="#CBD5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="500">I design and ship digital products that hold up in production.</text>
      <text x="1" y="168" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5">Interfaces, business logic, data, integrations, testing, and deployment.</text>

      <g transform="translate(0 198)">
        <rect width="556" height="58" rx="14" fill="#020617" stroke="#334155" stroke-opacity=".85"/>
        <circle cx="22" cy="18" r="4" fill="#FB7185"/>
        <circle cx="36" cy="18" r="4" fill="#FBBF24"/>
        <circle cx="50" cy="18" r="4" fill="#34D399"/>
        <text x="22" y="42" fill="#94A3B8" font-family="Consolas, SFMono-Regular, monospace" font-size="12">$</text>
        <text x="39" y="42" fill="#E2E8F0" font-family="Consolas, SFMono-Regular, monospace" font-size="12">build --with clarity --ship reliably</text>
        <rect class="type-cover" x="39" y="29" width="270" height="17" fill="#020617"/>
        <rect class="cursor" x="304" y="31" width="7" height="14" rx="1" fill="#67E8F9"/>
      </g>

      <text x="1" y="294" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">DISCOVER  ·  DESIGN  ·  BUILD  ·  SHIP</text>
    </g>

    <g transform="translate(726 38)" filter="url(#shadow)">
      <rect width="414" height="284" rx="30" fill="#0B1728" fill-opacity=".82" stroke="#475569" stroke-opacity=".48"/>
      <rect x=".75" y=".75" width="412.5" height="282.5" rx="29.25" stroke="#67E8F9" stroke-opacity=".08" stroke-width="1.5"/>
      <circle cx="208" cy="144" r="92" stroke="#334155" stroke-opacity=".72"/>
      <circle class="ring" cx="208" cy="144" r="66" stroke="url(#coreGradient)" stroke-opacity=".42" stroke-width="1.5"/>

      <path d="M92 70C128 82 149 102 169 124" stroke="#334155" stroke-width="1.5"/>
      <path class="route" d="M92 70C128 82 149 102 169 124" stroke="url(#routeGradient)" stroke-width="2" stroke-linecap="round"/>
      <path d="M319 78C282 85 257 104 241 126" stroke="#334155" stroke-width="1.5"/>
      <path class="route" d="M319 78C282 85 257 104 241 126" stroke="url(#routeGradient)" stroke-width="2" stroke-linecap="round" style="animation-direction:reverse"/>
      <path d="M92 216C131 207 154 187 172 165" stroke="#334155" stroke-width="1.5"/>
      <path class="route" d="M92 216C131 207 154 187 172 165" stroke="url(#routeGradient)" stroke-width="2" stroke-linecap="round" style="animation-direction:reverse"/>
      <path d="M321 215C281 207 257 187 240 165" stroke="#334155" stroke-width="1.5"/>
      <path class="route" d="M321 215C281 207 257 187 240 165" stroke="url(#routeGradient)" stroke-width="2" stroke-linecap="round"/>

      <g transform="translate(208 144)">
        <g class="core">
        <circle r="43" fill="#07111F" stroke="url(#coreGradient)" stroke-width="2"/>
        <circle r="34" fill="url(#coreGradient)" fill-opacity=".12"/>
        <text x="0" y="5" text-anchor="middle" fill="#E0F2FE" font-family="Consolas, SFMono-Regular, monospace" font-size="20" font-weight="700">&lt;/&gt;</text>
        <text x="0" y="23" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.2">FULL STACK</text>
        </g>
      </g>

      <g transform="translate(24 48)">
        <g class="float-one">
          <rect width="126" height="38" rx="19" fill="#0E2434" stroke="#22D3EE" stroke-opacity=".38"/>
          <circle cx="18" cy="19" r="4" fill="#22D3EE"/>
          <text x="31" y="24" fill="#CFFAFE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.1">INTERFACES</text>
        </g>
      </g>
      <g transform="translate(296 58)">
        <g class="float-two">
          <rect width="92" height="38" rx="19" fill="#111C38" stroke="#60A5FA" stroke-opacity=".4"/>
          <circle cx="18" cy="19" r="4" fill="#60A5FA"/>
          <text x="31" y="24" fill="#DBEAFE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">APIs</text>
        </g>
      </g>
      <g transform="translate(26 198)">
        <g class="float-three">
          <rect width="116" height="38" rx="19" fill="#0E2434" stroke="#22D3EE" stroke-opacity=".36"/>
          <circle cx="18" cy="19" r="4" fill="#34D399"/>
          <text x="31" y="24" fill="#D1FAE5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.1">REALTIME</text>
        </g>
      </g>
      <g transform="translate(282 198)">
        <g class="float-four">
          <rect width="108" height="38" rx="19" fill="#21132F" stroke="#C084FC" stroke-opacity=".4"/>
          <circle cx="18" cy="19" r="4" fill="#C084FC"/>
          <text x="31" y="24" fill="#F3E8FF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">DELIVERY</text>
        </g>
      </g>

      <g transform="translate(24 18)">
        <circle cx="4" cy="4" r="4" fill="#34D399"/>
        <text x="16" y="8" fill="#94A3B8" font-family="Consolas, SFMono-Regular, monospace" font-size="8.5" letter-spacing="1.25">PRODUCT SYSTEM / ONLINE</text>
      </g>
    </g>
    <rect x=".75" y=".75" width="1198.5" height="358.5" rx="27.25" stroke="#67E8F9" stroke-opacity=".14" stroke-width="1.5"/>
  </g>
</svg>
